<header class="header">
  <nav class="navbar">
    <div class="nav-container">
      <!-- Logo -->
      <div class="nav-logo">
        <a routerLink="/home" (click)="closeMenu()">
          <span class="logo-text">Front Lab</span>
        </a>
      </div>

      <!-- Desktop Menu -->
      <div class="nav-menu">
        <a routerLink="/home" 
           routerLinkActive="active" 
           class="nav-link">
          🏠 Inicio
        </a>
        <a routerLink="/new-request" 
           routerLinkActive="active" 
           class="nav-link">
          ➕ Nueva Solicitud
        </a>
        <a routerLink="/edit-request" 
           routerLinkActive="active" 
           class="nav-link">
          ✏️ Editar Solicitud
        </a>
        <a routerLink="/pull-request" 
           routerLinkActive="active" 
           class="nav-link">
          🔄 Pull Requests
        </a>
      </div>

      <!-- Mobile Menu Toggle -->
      <div class="nav-toggle" (click)="toggleMenu()">
        <span class="bar" [class.active]="isMenuOpen"></span>
        <span class="bar" [class.active]="isMenuOpen"></span>
        <span class="bar" [class.active]="isMenuOpen"></span>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div class="nav-menu-mobile" [class.active]="isMenuOpen">
      <a routerLink="/home" 
         routerLinkActive="active" 
         class="nav-link-mobile"
         (click)="closeMenu()">
        🏠 Inicio
      </a>
      <a routerLink="/new-request" 
         routerLinkActive="active" 
         class="nav-link-mobile"
         (click)="closeMenu()">
        ➕ Nueva Solicitud
      </a>
      <a routerLink="/edit-request" 
         routerLinkActive="active" 
         class="nav-link-mobile"
         (click)="closeMenu()">
        ✏️ Editar Solicitud
      </a>
      <a routerLink="/pull-request" 
         routerLinkActive="active" 
         class="nav-link-mobile"
         (click)="closeMenu()">
        🔄 Pull Requests
      </a>
    </div>
  </nav>
</header>
