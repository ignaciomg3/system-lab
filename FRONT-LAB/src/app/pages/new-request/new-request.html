<div class="new-request-form">
  <div class="form-header">
    <h2>Cotización — Nueva Solicitud</h2>

    <div class="header-right">
      <div class="header-field">
        <label for="fecha">Fecha</label>
        <input id="fecha" name="fecha" type="date" [(ngModel)]="request.fecha" />
      </div>

      <div class="header-field">
        <label for="entregaFecha">Fecha de entrega</label>
        <input id="entregaFecha" name="entregaFecha" type="date" [(ngModel)]="request.entregaFecha" />
      </div>
    </div>
  </div>

  <form (ngSubmit)="createRequest()" #f="ngForm" novalidate>

    <!-- Cliente -->
    <div class="form-row">
      <label for="cliente">Nombre (Cliente)</label>
      <select id="cliente"
              name="cliente"
              [(ngModel)]="request.clienteId"
              (change)="onClientChange()"
              required>
        <option [ngValue]="null">-- Seleccionar cliente --</option>
        <option *ngFor="let c of clients" [ngValue]="c.id">{{ c.nombre }}</option>
      </select>
    </div>

    <!-- CUIT -->
    <div class="form-row">
      <label for="cuit">CUIT</label>
      <input id="cuit" name="cuit" type="text" [(ngModel)]="request.cuit" readonly />
    </div>

    <!-- Dirección -->
    <div class="form-row">
      <label for="direccion">Dirección</label>
      <input id="direccion" name="direccion" type="text" [(ngModel)]="request.direccion" readonly />
    </div>

    <!-- Responsable -->
    <div class="form-row">
      <label for="responsable">Responsable</label>
      <select id="responsable" name="responsable" [(ngModel)]="request.responsable">
        <option value="Ramiro">Ramiro</option>
        <option value="Javier">Javier</option>
      </select>
    </div>

    <!-- Atención -->
    <div class="form-row">
      <label for="atencion">Atención</label>
      <input id="atencion" name="atencion" type="text" [(ngModel)]="request.atencion" />
    </div>

    <hr />

    <!-- Muestras (repetible) -->
    <div class="muestras-section">
      <h3>Muestras</h3>

      <div class="muestra-card" *ngFor="let sample of request.muestras; let i = index">
        <div class="muestra-header">
          <strong>Muestra {{ i + 1 }}</strong>
          <div class="muestra-actions">
            <button type="button" class="btn-link" (click)="removeSample(i)" [disabled]="request.muestras.length === 1">Eliminar</button>
          </div>
        </div>

        <div class="form-row">
          <label for="tipo-{{i}}">Muestra de</label>
          <select id="tipo-{{i}}"
                  name="tipo-{{i}}"
                  [(ngModel)]="request.muestras[i].tipo"
                  (change)="onSampleTypeChange(i)">
            <option [ngValue]="null">-- Seleccionar tipo --</option>
            <option *ngFor="let t of sampleTypes" [value]="t">{{ t }}</option>
          </select>
        </div>

        <div class="form-row">
          <label>Análisis disponibles</label>
          <div class="analisis-list">
            <div *ngFor="let analisis of availableAnalysesFor(request.muestras[i].tipo)">
              <input type="checkbox"
                     [id]="'chk-' + i + '-' + analisis"
                     (change)="toggleSampleAnalysis(i, analisis, $event)"
                     [checked]="request.muestras[i].analisisSeleccionados.includes(analisis)" />
              <label [for]="'chk-' + i + '-' + analisis">{{ analisis }}</label>
            </div>
          </div>
        </div>
      </div>

      <div class="muestras-add">
        <button type="button" class="btn-primary" (click)="addSample()">Agregar muestra</button>
      </div>
    </div>

    <hr />

    <div class="form-actions">
      <button type="submit" class="btn-submit">Generar cotización</button>
      <button routerLink="/home" type="button" class="btn-secondary">Volver</button>
    </div>
  </form>
</div>
